[project]
name = "pii-gateway"
version = "0.1.0"
description = "Demonstração de pseudonimização determinística para LLMs"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "cryptography>=43",
    "fastapi>=0.115",
    "httpx>=0.27",
    "openai>=1.50",
    "pydantic>=2.9",
    "sqlalchemy>=2.0",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
ner = ["gliner>=0.2.16"]

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pii_gateway"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
